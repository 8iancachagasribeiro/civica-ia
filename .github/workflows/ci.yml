name: Testes do MVP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Checar JavaScript do aplicativo
        run: node --check app/static/app.js && node --check app/static/compare.js && node --check app/static/scenario.js && node --check app/static/sw.js
      - name: Validar manifesto
        run: |
          python -m json.tool app/static/manifest.webmanifest > /dev/null
          python -m json.tool app/static/data/impact_studies.json > /dev/null
      - name: Rodar testes
        run: python -m pytest -q
