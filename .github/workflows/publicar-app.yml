name: Publicar Cívica App
on:
  push:
    branches: [main]
    paths:
      - 'app/static/**'
      - 'scripts/build_icons.py'
      - '.github/workflows/publicar-app.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Javascript and PWA manifest
        run: |
          node --check app/static/app.js
          node --check app/static/compare.js
          node --check app/static/scenario.js
          node --check app/static/sw.js
          python -m json.tool app/static/manifest.webmanifest >/dev/null
      - name: Create icon assets if unavailable
        run: |
          if [ ! -f app/static/icon-512.png ]; then python -m scripts.build_icons; fi
      - name: Validate published source snapshot
        run: |
          test -s app/static/data/evidence.json
          python -m json.tool app/static/data/evidence.json >/dev/null
          python -m json.tool app/static/data/impact_studies.json >/dev/null
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
